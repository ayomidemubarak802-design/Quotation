<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nav</title>
<style>
.mobile-nav{display:flex; justify-content:space-between; align-items:center; padding:14px 5%; background:#2563eb; color:#fff}
.nav-links{display:flex; gap:20px; list-style:none}
.menu-icon{display:none; font-size:24px; cursor:pointer}
@media(max-width:768px){
  .nav-links{display:none; flex-direction:column; position:absolute; top:60px; left:0; width:100%; background:#1e40af; padding:20px}
  .menu-icon{display:block}
</style>
</head>

<body>
  <nav class="mobile-nav">
  <div class="logo">MyApp</div>
  <div class="menu-icon" onclick="toggleMenu()">☰</div>
  <ul id="menu" class="nav-links">
    <li><a href="#">Home</a></li>
    <li><a href="#">Calculator</a></li>
    <li><a href="#">Notes</a></li>
    <li><a href="#">Logout</a></li>
  </ul>
</nav>

<script>
function toggleMenu(){document.getElementById('menu').style.display = 
document.getElementById('menu').style.display==='flex'?'none':'flex'}
</script>
</body>

</html>
